name: Build and publish creds

on:
  push:
    branches:
      - main

    paths:
      - "creds/**"
      - "lib/**"
      - "fonts/**"
      - "style.yaml"
      - "Makefile"
      - ".github/workflows/build.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build creds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.0"

      - name: Build site
        run: make site

      - name: Upload creds as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: creds
          path: build
          if-no-files-found: error
          retention-days: 90

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    name: Publish creds
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
