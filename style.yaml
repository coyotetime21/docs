version: 1

brand:
  name: "Глеб Лещук"
  role: "AI Product Engineer"
  telegram: "@coyotetime"
  offer: "Внедряю ИИ-агентов, чтобы команда тратила время на развитие, а не на рутину"
  offer_sub: "От аудита и прототипа до запуска и поддержки."

fonts:
  heading:
    family: "Source Serif 4"
    fallback: serif
    weight: 600
    letter_spacing_em: -0.010
    case: none
    line_height: 1.18
  body:
    family: "Rubik"
    fallback: sans-serif
    weight: 400
    line_height: 1.45
  numbers:
    family: "JetBrains Mono"
    fallback: monospace
    weight: 600
  label:
    font: numbers
    weight: 600
    case: upper
    letter_spacing_em: 0.11

type_scale:
  base: 22
  ratio: 1.333
  sizes:
    label: 16
    small: 17
    body: 22
    lead: 25
    h3: 29
    h2: 39
    h1: 52
    display: 69
    metric: 79

web:
  base_px: 17
  ratio: 1.25

colors:
  bg: "#141619"
  surface: "#1D2024"
  text: "#EDEAE3"
  muted: "#9DA1A8"
  border: "#30343A"
  accent: "#F0A93A"
  on_accent: "#141619"
  accent_2: "#7FB7FF"
  inverse_bg: "#F0A93A"
  inverse_text: "#141619"

contrast:
  text_on_bg: 15.1
  muted_on_bg: 7.0
  accent_on_bg: 9.0
  on_accent: 9.0
  inverse: 9.0

shape:
  radius: 12
  border_width: 1
  spacing_unit: 8
  slide_padding: [64, 72]

components:
  card: bar
  tag: caps
  button: filled
  heading_decoration: none
  background_pattern: dots
  screenshot_frame: shadow
  cover_inverse: false
  cta_inverse: true
